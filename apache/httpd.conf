ServerRoot "/usr/local/apache2"
# Listen on a configurable, unprivileged port so the container can run as a
# non-root user (compose `user:` from PLANDROP_UID/PLANDROP_GID). The value is
# interpolated from the container environment (set by docker-compose).
Listen ${PLANDROP_APACHE_PORT}

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule dir_module modules/mod_dir.so

LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authn_file_module modules/mod_authn_file.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_user_module modules/mod_authz_user.so
LoadModule auth_basic_module modules/mod_auth_basic.so

LoadModule dav_module modules/mod_dav.so
LoadModule dav_fs_module modules/mod_dav_fs.so
LoadModule vhost_alias_module modules/mod_vhost_alias.so

# Alias maps the shared /.plandrop/ path to the theme volume; autoindex lists
# tenant directories that have no index.html; rewrite falls a missing per-tenant
# autoindex header/footer back to the shared default chrome and owns the
# trailing-slash redirect; headers strips the origin off mod_dav's Location.
LoadModule alias_module modules/mod_alias.so
LoadModule autoindex_module modules/mod_autoindex.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule headers_module modules/mod_headers.so

# No User/Group: the container runs as a non-root user chosen in compose, so
# Apache must not attempt to setuid (which requires root). DAV writes therefore
# happen as that configured UID, matching the data dir's host-side ownership.

# Self-referential URLs must name the origin the CLIENT used, never this
# container's listen socket — an operator's TLS proxy terminates elsewhere, and
# this port is neither reachable nor tellable from outside. UseCanonicalName Off
# takes the host from the request's own Host header, the only workable source
# here: one dynamic vhost serves every tenant, so there is no per-tenant
# ServerName to canonicalise against.
ServerName localhost
UseCanonicalName Off

# mod_dav stamps a 201 Created with an absolute Location built from this
# server's own scheme and port. Strip the origin off it: a path-only Location is
# resolved by the client against the URL it actually requested, which is right
# behind a TLS proxy, behind a plain-HTTP one, and with no proxy at all. Editing
# reaches this one because 201 is a success response — the trailing-slash
# redirect is not, and is handled where it is issued (see <Directory "/srv">).
Header edit Location "^[A-Za-z][A-Za-z0-9+.-]*://[^/]*(/.*)$" "$1"

# Keep all runtime state out of the root-owned image dirs so a non-root user
# can start: pid file, lock DB, and mutexes go to writable locations.
PidFile "/tmp/httpd.pid"
DavLockDB "/tmp/DavLock"
Mutex posixsem
ErrorLog /proc/self/fd/2
LogLevel warn

# Serve correct Content-Type by extension, and answer a bare directory URL with
# index.html (the static-hosting contract relied on by the upload path).
TypesConfig conf/mime.types
DirectoryIndex index.html

# Declare the encoding of every text response. Apache appends no charset by
# default, and a document that cannot state its own encoding in-band is then
# decoded with whatever default the reader's browser happens to use — UTF-8
# bytes read as Latin-1, so "·" (C2 B7) displays as "Â·". HTML escapes this
# only because the templates carry their own <meta charset>; plain text has no
# such mechanism and depends entirely on this header.
AddDefaultCharset utf-8

# The stock mime.types ships its markdown entry commented out, so a .md file is
# served with no Content-Type at all and the browser is left to guess both type
# and encoding. text/plain keeps it readable in a browser tab and takes the
# charset above; text/markdown is the stricter type but browsers download it
# rather than display it, which loses in-browser reading of published notes.
AddType text/plain .md

<Directory />
    AllowOverride none
    Require all denied
</Directory>

# Own the trailing-slash redirect for every served tree. Apache answers a
# directory URL that lacks its slash with mod_dir's DirectorySlash 301, whose
# Location it builds from this server's scheme and port — behind a TLS proxy
# that is an internal socket the client cannot reach, so a client following the
# redirect lands nowhere and anything logging the URL learns the topology.
# mod_headers cannot repair that Location: a redirect is delivered as an error
# response, which strips the content-set output filters, so no Header rule ever
# sees it. Issuing the redirect a phase earlier, from mod_rewrite's fixup, wins
# over mod_dir's handler and builds the URL from what the client sent instead.
# Per-directory context is the point: it runs after map-to-storage, so
# REQUEST_FILENAME is the real, decoded path, and this one block covers the
# tenant tree and both theme mounts. NE stops REQUEST_URI's existing escaping
# from being escaped a second time.
<Directory "/srv">
    RewriteEngine On
    # A proxy that declares the client's scheme is believed over this
    # connection's, which is plain HTTP whenever TLS is terminated in front.
    RewriteCond %{REQUEST_URI} !/$
    RewriteCond %{REQUEST_FILENAME} -d
    RewriteCond %{HTTP:X-Forwarded-Proto} ^(https?)$
    RewriteRule ^ "%1://%{HTTP_HOST}%{REQUEST_URI}/" [R=301,NE,L]
    # Nothing in front, or a proxy that declares nothing: this connection's own
    # scheme is the client's. Host carries the client's port when it used a
    # non-default one, so the whole origin round-trips.
    RewriteCond %{REQUEST_URI} !/$
    RewriteCond %{REQUEST_FILENAME} -d
    RewriteRule ^ "%{REQUEST_SCHEME}://%{HTTP_HOST}%{REQUEST_URI}/" [R=301,NE,L]
</Directory>

<Directory "/srv/hosts">
    Require all granted
    # List directories with no index.html (B-04), wrapped in template chrome.
    # FancyIndexing draws the list; SuppressHTMLPreamble drops Apache's own
    # <html>/<head> so the header file supplies the document preamble (which is
    # also why IndexStyleSheet/IndexHeadInsert are useless here — they only emit
    # into the suppressed preamble; the listing is styled by the chrome's shared
    # stylesheet instead). SuppressRules drops the raw <hr> rows, NameWidth=*
    # never truncates long document names, FoldersFirst keeps directories on
    # top. The header/footer are hidden per-tenant dotfiles a tenant may upload;
    # if absent the RewriteRule below serves the shared default chrome instead.
    Options +Indexes
    # One non-incremental declaration, deliberately: mixing '+' keywords with
    # value options (NameWidth=, Charset=) makes Apache silently drop the
    # incremental ones — SuppressHTMLPreamble included, which resurrects
    # Apache's own preamble on top of the chrome's.
    IndexOptions FancyIndexing SuppressHTMLPreamble HTMLTable SuppressDescription SuppressRules FoldersFirst IgnoreCase NameWidth=* Charset=UTF-8
    HeaderName .header.html
    ReadmeName .footer.html
    # The chrome dotfiles must never appear as entries in the visible listing.
    IndexIgnore .header.html .footer.html .plandrop ..
</Directory>

# Operator drop-in templates from the separate user mount, served namespaced
# under /.plandrop/user/. Declared BEFORE the /.plandrop/ alias because mod_alias
# takes the first matching Alias, so the more specific prefix must come first.
Alias "/.plandrop/user/" "/srv/user-templates/"
<Directory "/srv/user-templates">
    Require all granted
    <LimitExcept GET HEAD OPTIONS>
        Require all denied
    </LimitExcept>
</Directory>

# Shared template assets, the same for every tenant. A published doc's relative
# .plandrop/<name>/... link resolves to /.plandrop/<name>/... on its host; this
# Alias maps that host-independent path to the read-only theme volume. mod_alias
# is matched before mod_vhost_alias's docroot, so it applies across all vhosts.
Alias "/.plandrop/" "/srv/templates/"
<Directory "/srv/templates">
    Require all granted
    # Read-only: the theme volume is mounted ro, and any write method is denied
    # here regardless (cross-tenant/anon writes surface as 401, as elsewhere).
    <LimitExcept GET HEAD OPTIONS>
        Require all denied
    </LimitExcept>
</Directory>

# One vhost serves every subdomain via a dynamic docroot. Served content lives
# one level below the per-vhost dir (/srv/hosts/%1), reserving that dir for
# future per-vhost metadata.
<VirtualHost *:${PLANDROP_APACHE_PORT}>
    VirtualDocumentRoot "/srv/hosts/%1/www"

    # `.plandrop/` is a reserved namespace at EVERY depth, not just the host
    # root. A published document links its theme relatively
    # (`.plandrop/<theme>/css/…`), so a document at /plans/x.html asks for
    # /plans/.plandrop/<theme>/css/… — fold any such path back onto the single
    # shared one and let mod_alias resolve it against the read-only theme
    # volume, so one copy of the themes serves documents at any depth. The
    # consequence is deliberate: a tenant directory named `.plandrop` is
    # shadowed by the theme tree wherever it appears, which is why writes into
    # that namespace are refused outright (see the <Location> guards below)
    # rather than landing somewhere no read could ever reach. For the same
    # reason this is not limited to GET — a write must arrive at the guard, not
    # fall through to the tenant tree. `^/.+/` keeps the host-root path out of
    # it: /.plandrop/… is already mod_alias's own, untouched.
    RewriteEngine On
    RewriteRule "^/.+/\.plandrop/(.*)$" "/.plandrop/$1" [PT,L]

    # Autoindex chrome fallback. The fancy-index header/footer are per-tenant
    # dotfiles (.header.html / .footer.html). When a tenant has not uploaded one,
    # autoindex's internal subrequest for it maps to a non-existent file under the
    # tenant docroot; rewrite that to the seed-copied shared default chrome
    # (/.plandrop/default/...), which mod_alias then resolves to the theme volume.
    # [PT] hands the rewritten URI back to mod_alias; net behaviour is
    # local override -> default chrome -> (neither) graceful plain listing.
    # RewriteEngine is already on for this vhost (see the namespace rule above).
    # Reads only: a PUT of .header.html / .footer.html is a tenant uploading its
    # OWN chrome and must land normally (never be rewritten into the read-only
    # default path, which would 403 the upload). The local-file existence test is
    # built explicitly from the tenant docroot — /srv/hosts/<label>/www<uri>,
    # label = the first Host component — because this rewrite runs in server
    # context BEFORE map-to-storage, so neither %{REQUEST_FILENAME} nor
    # %{DOCUMENT_ROOT} yet reflects the dynamic VirtualDocumentRoot. Honoured:
    # a tenant's own .header.html/.footer.html wins; otherwise the default chrome.
    RewriteCond %{REQUEST_METHOD} =GET
    RewriteCond %{HTTP_HOST} ^([^.]+)
    RewriteCond "/srv/hosts/%1/www%{REQUEST_URI}" !-f
    RewriteRule "(?:^|/)\.header\.html$" "/.plandrop/default/header.html" [PT,L]
    RewriteCond %{REQUEST_METHOD} =GET
    RewriteCond %{HTTP_HOST} ^([^.]+)
    RewriteCond "/srv/hosts/%1/www%{REQUEST_URI}" !-f
    RewriteRule "(?:^|/)\.footer\.html$" "/.plandrop/default/footer.html" [PT,L]

    <Location "/">
        Dav On
        AuthType Basic
        AuthName "PlanDrop"
        AuthUserFile "/srv/auth/htpasswd"

        # Reads open to all; writes must be the tenant whose htpasswd username
        # equals the host label (the first Host component). This decouples the
        # domain from auth: the username is the bare label, not the full host.
        <LimitExcept GET HEAD OPTIONS>
            Require expr "%{HTTP_HOST} =~ /^([^.]+)/ && %{REMOTE_USER} == $1"
        </LimitExcept>
    </Location>

    # The shared theme path is read-only: reads are open, every write method
    # is denied (a PUT under /.plandrop/ -> 403). It stays inside the vhost's
    # DAV scope — mod_dav cannot disable a subtree of a DAV-enabled location
    # (a nested "Dav Off" is ignored and logs AH00578 on every request that
    # walks it) — so the method gate below is the mechanism, not a backstop.
    # This one block covers the namespace at every depth: the rule above has
    # already folded /any/depth/.plandrop/… onto this path by the time the
    # location walk runs. A COPY/MOVE naming a destination inside it is
    # refused too.
    <Location "/.plandrop/">
        <LimitExcept GET HEAD OPTIONS>
            Require all denied
        </LimitExcept>
    </Location>

    # `.plandrop` addressed WITHOUT a trailing slash — the one form the
    # namespace rule cannot recognise, since it needs the slash to know the
    # segment names a directory. This guard completes the namespace one above
    # by covering both shapes the bare name can take, at every depth:
    #   - a collection, which the theme tree would shadow the instant anything
    #     read through it, so it must never be created;
    #   - a plain file, which is the CLIENT'S CREDENTIAL DOTFILE — it holds the
    #     host's passphrase, and everything published here is world-readable, so
    #     publishing one would hand any reader write access to the host.
    # Denied by exception rather than by a method list, matching the theme-tree
    # guard, so a write method nobody enumerated cannot slip through. A
    # COPY/MOVE whose Destination names such a path is refused too: mod_dav
    # authorises the destination with an internal subrequest, which walks this
    # same block. Reads are left open — nothing of this name can exist for them
    # to reach.
    <LocationMatch "(?:^|/)\.plandrop$">
        <LimitExcept GET HEAD OPTIONS>
            Require all denied
        </LimitExcept>
    </LocationMatch>
</VirtualHost>
